# ============================================================
# Model & Backbone
# ============================================================
img_size: 512
backbone: swinv2_large_window12to16_192to256.ms_in22k_ft_in1k
backbone_channels: [192, 384, 768, 1536]   # SwinV2-Large stage dims
drop_path_rate: 0.2         # increased from 0.1 — combat overfitting
dropout: 0.2                # increased from 0.1 — combat overfitting

num_classes: 5
use_attention_pool: True    # spatial attention pooling in classification head
use_aux_head: True          # deep supervision auxiliary head on stage-3

# ============================================================
# Training
# ============================================================
batch_size: 8               # reduced for 40GB A100 (was 16, OOM)
accumulation_steps: 4       # effective batch size = 32 (unchanged)
num_workers: 8
lr: 3.0e-4                  # increased from 2.0e-4
backbone_lr_mult: 0.2       # backbone LR = 6e-5 (was 2e-5)
weight_decay: 0.05          # increased from 0.01 — combat overfitting
head_weight_decay: 0.1      # increased from 0.05 — combat overfitting

label_smoothing: 0.0        # removed — focal loss already provides soft targets
grad_clip_norm: 1.0

# Scheduler
scheduler: cosine           # cosine with linear warmup
warmup_epochs: 10           # linear warmup for 10 epochs
pct_start: 0.15             # used only if scheduler=onecycle
max_lr: 3.0e-4
div_factor: 25.0
final_div_factor: 1000.0

# Epochs & Early Stopping
epochs: 80
patience: 25

# SWA (Stochastic Weight Averaging)
use_swa: True
swa_start_epoch: 50         # delayed from 30 — start near convergence
swa_anneal_epochs: 5
swa_lr: 1.0e-6

# EMA
use_ema: True
ema_decay: 0.999

# ============================================================
# Loss
# ============================================================
focal_gamma: 1.5            # reduced from 2.0 — less aggressive easy-example downweighting
aux_loss_weight: 0.2        # deep supervision auxiliary loss weight

# ============================================================
# Mixup / CutMix
# ============================================================
use_mixup: True
mixup_alpha: 0.4
cutmix_alpha: 1.0
mix_prob: 0.2               # increased from 0.1 — combat overfitting
cutmix_prob: 0.5            # increased from 0.3 — combat overfitting


# ============================================================
# Ordinal Loss
# ============================================================
use_ordinal_loss: True
ordinal_loss_weight: 0.3

# ============================================================
# K-Fold Cross Validation
# ============================================================
use_kfold: True
n_folds: 5
kfold_seed: 42

# ============================================================
# Test-Time Augmentation
# ============================================================
use_tta: True
tta_scales: [0.8, 0.9, 1.0, 1.1, 1.2]   # expanded from 3 to 5 scales
tta_flips: True
tta_rotations: True
tta_center_crops: [0.9, 0.95]             # multi-crop TTA

# ============================================================
# Ensemble
# ============================================================
ensemble_folds: True
ensemble_ablations: False

# ============================================================
# Dataset Paths
# ============================================================
dataset_paths:
  train_images: "datasets/APTOS_19/train_images"
  train_csv: "datasets/APTOS_19/train_1.csv"
  val_images: "datasets/APTOS_19/val_images"
  val_csv: "datasets/APTOS_19/valid.csv"
  test_images: "datasets/APTOS_19/test_images"
  test_csv: "datasets/APTOS_19/test.csv"
  external_images: "datasets/Messidor_2/images"
  external_csv: "datasets/Messidor_2/messidor_data.csv"

# ============================================================
# Ablation flags
# ============================================================
use_msda: True
use_hff: True

# Class-balanced sampling (oversamples minority classes in train loader)
use_weighted_sampling: True


# ============================================================
# SSL Pretraining (Phase 2-3 of plan.md)
# ============================================================
# Path to SSL pretraining config (contains all SSL hyperparameters)
ssl_config: "configs/config_ssl.yaml"

# Path to SSL-pretrained backbone weights
# Set to null to use ImageNet pretraining
# Set to "checkpoints/ssl_pretrained_backbone.pth" to use SSL-pretrained weights
# ssl_pretrained_path: null
ssl_pretrained_path: "checkpoints/ssl_pretrained_backbone.pth"


